services:
  - type: web
    name: byteforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste the key in the Render dashboard, never in Git
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: NODE_ENV
        value: production
